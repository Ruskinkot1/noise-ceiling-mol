# Кандидаты эндпойнтов. chembl_id и названия записаны по памяти -> НЕ ПРОВЕРЕНО.
# Источник истины: проверка pref_name по API (data/raw/target_verification_*.csv); режим --discover убран (требовал SQLite).
min_docs: 2             # минимум разных документов на молекулу
min_replicated_mols: 100  # порог «достаточно повторов» для включения задачи (критерий нед. 3 — минимум 15 задач)
max_abs_pair_diff: 3.0  # пары с |Δ pChEMBL| > 3 считаются ошибками единиц/записи и отбрасываются (чувствительность — в scripts/03)
